# One command: `docker compose up --build`
#
# Every variable has a default, so this runs with NO .env file at all.
# Without an ANTHROPIC_API_KEY, the API uses its built-in mock AI provider.

name: refund-desk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refund_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refund_desk_dev}
      POSTGRES_DB: ${POSTGRES_DB:-refund_desk}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # "Container started" is not "database ready to accept connections".
    # The API waits for this check to pass before running migrations.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-refund_desk}:${POSTGRES_PASSWORD:-refund_desk_dev}@db:5432/${POSTGRES_DB:-refund_desk}
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  # web (Next.js) is added on Monday and will depend on api: service_healthy.

volumes:
  db-data:
